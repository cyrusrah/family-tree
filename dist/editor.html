<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارگاه شجره‌نامه — Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Noto+Naskh+Arabic:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFEDE8;--card:#FBFAF7;--ink:#2F1911;--soft:#7A6C64;
  --brand:#8F2502;--rule:#DCD6CD;--ok:#3F6B3A;--warn:#8A6A12;
  --gm:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 6'><path d='M0,3 L6,0 L12,3 L18,0 L24,3' stroke='black' fill='none' stroke-width='1'/><path d='M0,3 L6,6 L12,3 L18,6 L24,3' stroke='black' fill='none' stroke-width='1'/></svg>")}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:300;font-size:15px;line-height:1.7}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--brand)}
.hbar{display:flex;gap:.6rem;align-items:center;padding:.5rem .9rem;flex-wrap:wrap}
.emb{height:38px;flex:none}
.grow{flex:1;min-width:120px}
input.s{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.45rem .7rem}
.b{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.42rem .75rem;cursor:pointer;white-space:nowrap;font-size:.86rem}
.b.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.b.d{color:var(--brand)}
.b:disabled{opacity:.4;cursor:not-allowed}
.prog{font-size:.75rem;color:var(--soft);white-space:nowrap}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--ok)}
main{display:grid;grid-template-columns:290px 1fr;gap:1rem;padding:1rem;max-width:1240px;margin:0 auto;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
aside{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;background:var(--card);
  border:1px solid var(--rule);border-radius:3px}
@media(max-width:860px){aside{position:static;max-height:44vh}}
.hit{display:flex;align-items:flex-start;gap:.55rem;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:.5rem .7rem;cursor:pointer;font-size:.92rem}
.hit:hover{background:var(--paper)}
.hit[aria-current="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--brand)}
html[dir="rtl"] .hit[aria-current="true"]{box-shadow:inset -3px 0 0 var(--brand)}
.hit .hit-text{flex:1;min-width:0}
.hit small{display:block;font-size:.68rem;color:var(--soft);direction:ltr;text-align:start}
.hit .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:.55rem}
.dot.o{background:var(--ok)}.dot.w{background:var(--warn)}.dot.n{background:var(--rule)}
section.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:1rem;margin-bottom:1rem;box-shadow:1px 1px 0 0 var(--ink)}
.girih{height:6px;margin:.9rem 0;background-color:var(--rule);opacity:.55;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-size:24px 6px;mask-size:24px 6px;
  -webkit-mask-image:var(--gm);mask-image:var(--gm)}
h3{font-size:.95rem;font-weight:600}
.notes-fa{font-family:'Noto Naskh Arabic',Tahoma,serif;font-size:1.05rem;line-height:1.9}
h2{margin:0 0 .2rem;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.path{font-size:.72rem;color:var(--soft);direction:ltr;text-align:start;margin:0 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem}
label{display:block;font-size:.74rem;color:var(--soft);margin-bottom:.15rem}
input.f,select.f,textarea.f{width:100%;background:var(--paper);border:1px solid var(--rule);
  border-radius:3px;padding:.45rem .6rem}
textarea.f{resize:vertical}
.row{display:flex;gap:.4rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;background:none;border:0;text-align:start;cursor:pointer;padding:.2rem}
.row .nm:hover{color:var(--brand)}
.row .tag{font-size:.66rem;color:var(--soft);direction:ltr}
.row select.f{width:auto;min-width:7rem;max-width:11rem;flex:none;padding:.25rem .4rem;font-size:.8rem}
.mini{background:none;border:1px solid var(--rule);border-radius:3px;cursor:pointer;
  padding:.05rem .4rem;font-size:.8rem;color:var(--soft)}
.mini:hover{color:var(--brand);border-color:var(--brand)}
.mini.d:hover{color:var(--brand)}
.flag{background:#FBF4E4;border:1px solid var(--warn);border-radius:3px;padding:.6rem .8rem;
  font-size:.86rem;margin-bottom:.8rem}
.photo{display:flex;gap:.8rem;align-items:center}
.frame{width:92px;height:115px;flex:none;position:relative}
.frame svg{position:absolute;inset:0;width:100%;height:100%}
.frame img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);
  object-fit:cover;-webkit-clip-path:url(#shieldClip);clip-path:url(#shieldClip)}
.hint{font-size:.76rem;color:var(--soft);margin:.3rem 0 0}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--ink);color:#fff;
  padding:.5rem .9rem;border-radius:3px;font-size:.85rem;opacity:0;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.split{grid-template-columns:1fr}}
h3{font-size:.95rem;margin:0 0 .4rem;font-weight:600}
</style>
<style id="theme">/* Default pack — cream, sage, gold */
:root{
  --ink:#2C2118;
  --oxblood:#3D5A45;
  --accent:#3D5A45;
  --gold:#B08D57;
  --paper:#F7F3EA;
  --card:#FFFcf7;
  --rule:#E0D8C8;
  --muted:#7A6E60;
}
:root{
  --brand:var(--accent);
  --soft:var(--muted);
  --ok:#3F6B3A;
  --warn:#8A6A12;
}
</style>
</head>

function shrink(dataUrl, cb){

    const m = 520;

    const c = document.createElement('canvas');
    c.width = i.width * s; c.height = i.height * s;
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);

}
function linkSpouse(pid, name){

  const sid = pid + '+' + (i + 1);

    const pid = 'P-' + n;
    E[pid] = {
      id: pid, n: name, p: null, g: 0, sex: null,
      sp: [], no: [], c: [], fl: [], _new: true
    };
    E[childId] = Object.assign({}, E[childId] || {}, { p: pid });
  }
  rebuild(); save();
  cur = childId;
  renderAll();
  toast(t('parentAdded'));
}
function addChild(pid, name, fromDoc, mother){
  commitForm();
  const host = D[pid] || {};
  // Kids always use parent = blood parent. Adding from a spouse sets mother to that spouse.
  const parentId = host.spOf || pid;
  let n = 1; while (D[parentId + '-x' + n]) n++;
  const id = parentId + '-x' + n;
  const wives = spouseNames(parentId);
  let mo = (mother != null && mother !== undefined) ? String(mother).trim() : '';
  if (host.spOf) mo = host.n || mo;
  else if (!mo && wives.length === 1) mo = wives[0];
  E[id] = { id, n: name, p: parentId, g: (D[parentId].g || 0) + 1, mo, sp: [], no: [], c: [], fl: [], _new: true };
  const o = ord(parentId).concat([id]);
  E[parentId] = Object.assign({}, E[parentId] || {}, { order: o });
  if (fromDoc){
    const ab = ((D[parentId].absorbed) || []).concat([name]);
    E[parentId] = Object.assign({}, E[parentId], { absorbed: ab });
  }
  rebuild(); save();
  cur = pid;
  renderAll();
  requestAnimationFrame(() => { const el = document.getElementById('newc'); if (el){ el.value = ''; el.focus(); } });
}
function move(id, dir){
  const pid = D[id].p; const o = ord(pid); const i = o.indexOf(id);
  const j = i + dir; if (j < 0 || j >= o.length) return;
  o.splice(j, 0, o.splice(i, 1)[0]); touch(pid, { order: o }); renderAll();
}

function noteOf(r, e){
  const noteArr = e.no != null ? e.no : r.no;
  if (Array.isArray(noteArr)) return noteArr.filter(Boolean).join('\n') || null;
  return noteArr || null;
}
/** One people.json record — same shape for blood and spouse. */
function toPeopleRec(r){
  const e = E[r.id] || {};
  return {
    id: r.id,
    name: e.n != null ? e.n : (r.n || '?'),
    sex: e.sex != null ? e.sex : (r.sex || null),
    parent: r.id === 'ROOT' ? null : (e.p != null ? e.p : r.p) || null,
    mother: (e.mo != null ? e.mo : r.mo) || null,
    spouseOf: r.spOf || null,
    birth: (e.b != null ? e.b : r.b) || null,
    death: (e.d != null ? e.d : r.d) || null,
    place: (e.pl != null ? e.pl : r.pl) || null,
    family: (e.fam != null ? e.fam : r.fam) || null,
    job: (e.job != null ? e.job : r.job) || null,
    note: noteOf(r, e),
    origin: r.add ? 'family' : (r.origin || 'family'),
    flags: r.fl || [],
    photo: !!photoOf(r.id)
  };
}
function editorToPeople(){
  const people = [];
  const seen = new Set();
  function push(rec){ if (!rec || !rec.id || seen.has(rec.id)) return; seen.add(rec.id); people.push(rec); }
  function emitSpouses(r){
    const e = E[r.id] || {};
    const names = e.sp != null ? e.sp : (r.sp || []);
    (names || []).forEach((name, i) => {
      if (!name || !String(name).trim()) return;
      const sid = r.id + '+' + (i + 1);
      if (E[sid] && E[sid].deleted) return;
      const sd = D[sid] || { id: sid, n: String(name).trim(), spOf: r.id };
      const spRec = toPeopleRec(Object.assign({}, sd, { spOf: r.id }));
      if (!spRec.name || spRec.name === '?') spRec.name = String(name).trim();
      if (!spRec.sex) spRec.sex = 'f';
      push(spRec);
    });
  }
  function emitBlood(id){
    const r = D[id];
    if (!r || r.spOf || r.deleted || seen.has(id)) return;
    const rec = toPeopleRec(r);
    rec.spouseOf = null;
    push(rec);
    emitSpouses(r);
    ord(id).forEach(emitBlood);
  }
  emitBlood('ROOT');
  for (const id in D){
    if (!seen.has(id) && D[id] && !D[id].spOf && !D[id].deleted) emitBlood(id);
  }
  for (const id in E){
    if (seen.has(id)) continue;
    const e = E[id]; if (!e || e.deleted) continue;
    if (e._new || e.n){
      push(toPeopleRec(Object.assign({ id, n: e.n || '?', fl: [], add: true }, e)));
    }
  }
  return {
    meta: {
      root: 'ROOT',
      counts: { total: people.filter(p => p.id !== 'ROOT').length },
      conventions: { marks: 'male / female / unknown / root' }
    },
    people
  };
}
function importArchive(archive, photos){
  const people = archive.people || [];
  const byId = {};
  people.forEach(p => { byId[p.id] = p; });
  const wives = {};
  people.forEach(p => {
    if (p.spouseOf) (wives[p.spouseOf] = wives[p.spouseOf] || []).push(p);
  });
  E = {};
  for (const id of Object.keys(BASE)){
    if (!byId[id]) E[id] = { deleted: true };
  }
  for (const p of people){
    const patch = {
      n: p.name || '?',
      p: p.id === 'ROOT' ? null : (p.parent || null),
      mo: p.mother || '',
      sex: p.sex || null,
      b: p.birth || '',
      d: p.death || '',
      pl: p.place || '',
      fam: p.family || '',
      job: p.job || '',
      no: p.note ? String(p.note).split(/\n/) : [],
      _new: !BASE[p.id]
    };
    if (p.spouseOf){ E[p.id] = patch; continue; }
    const list = wives[p.id] || [];
    const sp = [];
    list.forEach(w => {
      const m = /\+(\d+)$/.exec(w.id);
      const i = m ? (+m[1] - 1) : sp.length;
      while (sp.length <= i) sp.push('');
      sp[i] = w.name || '';
    });
    patch.sp = sp;
    E[p.id] = patch;
  }
  PH = Object.assign({}, photos || {});
}
async function exportFullArchive(){
  if (typeof commitEditorForm === 'function') commitEditorForm();
  const archive = editorToPeople();
  const photos = {};
  const ids = new Set([...Object.keys(D), ...Object.keys(PH)]);
  for (const id of ids){
    if (Object.prototype.hasOwnProperty.call(PH, id) && !PH[id]){ photos[id] = null; continue; }
    const src = photoOf(id);
    if (!src) continue;
    if (src.startsWith('data:')){ photos[id] = src; continue; }
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      const blob = await res.blob();
      photos[id] = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(blob);
      });
    } catch (_e) {}
  }
  const blob = new Blob([JSON.stringify({ v: 1, archive, photos }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'family-export.json'; a.click();
  toast(t('exportFullDone'));
}

document.getElementById('expFull').addEventListener('click', () => exportFullArchive());
document.getElementById('resetSite').addEventListener('click', async () => {
  if (!confirm(t('resetToSiteConfirm'))) return;
  E = {}; PH = {};
  await save();
  cur = 'ROOT';
  rebuild(); renderAll();
  toast(t('resetToSiteDone'));
});
document.getElementById('imp').onchange = e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.archive && Array.isArray(j.archive.people)) importArchive(j.archive, j.photos || {});
      else { E = j.edits || {}; PH = j.photos || {}; }
      rebuild(); save(); renderAll(); toast(t('imported'));
    } catch (x) { alert(t('importFailed')); }
  };
  r.readAsText(f); e.target.value = '';
};
document.getElementById('q').addEventListener('input', renderList);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  go(b.dataset.go);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault(); commitForm({ rerender: true }); toast(t('saved'));
  }
});

function renderAll(){ renderList(); renderPane(); }
(async () => {
  applyStaticI18n();
  await idb();
  const prev = await get('dataRev');
  if (prev !== DATA_REV){
    E = {}; PH = {};
    await put('edits', E); await put('photos', PH); await put('dataRev', DATA_REV);
  } else {
    E = (await get('edits')) || {};
    PH = (await get('photos')) || {};
  }
  rebuild(); renderAll();
})();

</script>
